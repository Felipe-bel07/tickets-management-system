<!-- TOPBAR -->
<div class="topbar">
  <div class="admin-crown"><i class="fa-solid fa-crown" style="font-size:11px"></i> ADMINISTRATOR</div>
  <div class="aside-topbar">
    <button class="btn-new"> Create reservation</button>

    <div class="links-pill" id="btn-logout"><i class="fa-solid fa-link"></i> Log Out</div>


    <div class="topbar-avatar"><img src="/frontend/img/perfil.png" alt="Admin"></div>
  </div>
</div>


<!-- CONTENT -->
<div class="content-area">

  <!-- TICKET TABLE -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Reservation</span>
      <div class="search-small">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="admin-search" type="text" placeholder="Search tickets...">
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Requested by</th>
            <th>Room</th>
            <th>Date</th>
            <th>Starts at</th>
            <th>Ends at</th>
            <th>Reason</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
      </table>
    </div>
  </div>

   



</div>
